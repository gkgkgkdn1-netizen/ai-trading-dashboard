name: AI Trading Auto Bot
on:
  schedule:
    # 깃허브는 UTC 시간 기준입니다. 한국 시간(KST) 오전 9시~새벽 1시는 UTC로 00시~16시입니다.
    # 매 정각에 실행 (분 시 일 월 요일)
    - cron: '0 0-16 * * *'
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 자동화 봇 실행
        env:
          RAW_KEY: ${{ secrets.RAW_KEY }}
        run: python auto_bot.py